name: README cards

on:
  schedule:
    - cron: "17 1 * * *" # daily, 06:47 IST
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ["scripts/**", "fonts/**", "assets/**", ".github/workflows/readme-cards.yml"]

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install fonttools==4.*

      - name: Fetch contributions into data/contributions.json
        env:
          # Optional repo secret CONTRIB_TOKEN (a read-only PAT) also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python scripts/render_readme_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
